# 示例配置文件，模拟 miniblog 的配置

# 通用配置
runmode: debug         # 运行模式，可选：debug, release, test
server:
  addr: :8080          # HTTP 服务器监听地址
  timeout: 10          # 优雅关闭超时时间（秒）

# 日志配置
log:
  level: debug                 # 日志级别：debug, info, warn, error, dpanic, panic, fatal
  format: console              # 日志格式：console, json
  disable-caller: false        # 是否开启 caller，如果开启会在日志中显示调用日志所在的文件和行号
  disable-stacktrace: false    # 是否禁止在 panic 及以上级别打印堆栈信息
  output-paths:                # 日志输出位置
    - stdout
    - ./logs/miniexample.log
  rotate:                      # 日志轮转配置
    max-size: 10               # 单个日志文件最大大小（MB）
    max-age: 7                 # 日志文件最大保留天数
    max-backups: 10            # 最大保留的日志文件数
    compress: false            # 是否压缩旧的日志文件

# 数据库配置
db:
  # 数据库连接字符串
  dsn: root:12345678@tcp(localhost:3308)/miniblog?charset=utf8mb4&parseTime=True&loc=Local
  # 最大打开连接数
  max-open-conns: 100
  # 最大空闲连接数
  max-idle-conns: 10
  # 连接最大生命周期（分钟）
  conn-max-lifetime: 60

# JWT配置
jwt:
  # 签名密钥
  key: JnCEIL6CRbnLj6U5PO4nKXJtUZRvDG87
  # 令牌过期时间（小时）
  expire: 24

# 限流配置
ratelimit:
  # 每秒请求次数限制
  qps: 100
  # 允许的最大突发请求数
  burst: 50

# 认证和授权配置
auth:
  # 默认角色
  default-role: reader
  # 超级管理员用户列表
  admin-users:
    - admin
  # 预设角色权重（用于基于角色的授权）
  role-weights:
    admin: 100
    editor: 50
    reader: 10 